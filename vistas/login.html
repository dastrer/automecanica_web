<!-- [ auth-signin ] start -->
<div class="auth-wrapper">
	<div class="auth-content container">
		<div class="card">
			<div class="row align-items-center">
				<div class="col-md-6">
					<div class="card-body">
						<div class="text-center">
							<h3 class="mb-3 f-w-400">MECANICA AUTOMOTRIZ</h3>
							<img src="../assets/images/logo-Recuperado.png" alt="" class="img-fluid mb-4">
							<h4 class="mb-3 f-w-400">Ingresa tus datos para iniciar tu sesión</h4>
						</div>

						<form method="post" id="frmAcceso">
							<div class="input-group mb-2">
								<div class="input-group-prepend">
									<span class="input-group-text"><i class="feather icon-user"></i></span>
								</div>
								<input type="text" id="logina" name="logina" class="form-control" placeholder="Login">
							</div>
							<div class="input-group mb-3">
								<div class="input-group-prepend">
									<span class="input-group-text"><i class="feather icon-lock"></i></span>
								</div>
								<input type="password" id="clavea" name="clavea" class="form-control"
									placeholder="Password">
								<div class="input-group-append">
									<div class="input-group-text" id="togglePassword">
										<span class="fas fa-eye"></span>
									</div>
								</div>
							</div>

							<div class="form-group text-left mt-2">
								<div class="checkbox checkbox-primary d-inline">
									<input type="checkbox" name="checkbox-fill-1" id="checkbox-fill-a1" checked="">
									<label for="checkbox-fill-a1" class="cr"> Recordar</label>
								</div>
							</div>
							<button type="submit" class="btn btn-primary mb-4">Login</button>
							<p class="mb-2 text-muted">Olvidaste tu contraseña? <a href="forgot-password.html"
									class="f-w-400">Reset</a></p>
						</form>
					</div>
				</div>
				<div class="col-md-6 d-none d-md-block">
					<img src="../assets/images/auth-bg.jpg" alt="" class="img-fluid">
				</div>
			</div>
		</div>
	</div>
</div>
